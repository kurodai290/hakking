<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 1 — VIEW SOURCE</title><link rel="stylesheet" href="../style.css"></head>
<body>
<header><div class="logo">BLACKBOX<span>//LAB</span></div><div class="status">STAGE 01 / 10</div></header>
<main class="panel">
<div class="top"><div><div class="tag">STAGE 01</div><h1>VIEW SOURCE</h1></div><div class="hint">AUTHORIZED // LOCAL ONLY</div></div>
<div class="box"><p>画面に表示されている情報だけがすべてとは限らない。</p><p class="hint">ヒント：HTMLはブラウザに届いています。</p><div class="secret">STAGE1_CODE=GREEN-DOOR-17</div></div>
<div class="box">
<h2>UNLOCK</h2>
<input id="answer" class="input" autocomplete="off" placeholder="解除コード">
<button class="submit" id="go">CHECK</button><div id="msg" class="msg"></div>
</div>
</main>
<script>
const expected="GREEN-DOOR-17";
document.getElementById('go').onclick=()=>{
 const v=document.getElementById('answer').value.trim();
 const m=document.getElementById('msg');
 if(v===expected){m.className='msg ok';m.textContent='ACCESS GRANTED';setTimeout(()=>location.href="stage2.html",500)}
 else{m.className='msg bad';m.textContent='ACCESS DENIED';}
};

</script>
</body></html>
