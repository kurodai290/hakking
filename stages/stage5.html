<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 5 — APPLICATION STORAGE</title><link rel="stylesheet" href="../style.css"></head>
<body>
<header><div class="logo">BLACKBOX<span>//LAB</span></div><div class="status">STAGE 05 / 10</div></header>
<main class="panel">
<div class="top"><div><div class="tag">STAGE 05</div><h1>APPLICATION STORAGE</h1></div><div class="hint">AUTHORIZED // LOCAL ONLY</div></div>
<div class="box"><p>ブラウザが保存しているデータを調査する。HTMLだけを見ていても見つからない。</p><p>このページは「記憶」を持っている。</p><p class="hint">ヒント：DevTools → Application → Local Storage / Session Storage。</p></div>
<div class="box">
<h2>UNLOCK</h2>
<input id="answer" class="input" autocomplete="off" placeholder="解除コード">
<button class="submit" id="go">CHECK</button><div id="msg" class="msg"></div>
</div>
</main>
<script>
const expected="STORAGE-DELTA-2048";
document.getElementById('go').onclick=()=>{
 const v=document.getElementById('answer').value.trim();
 const m=document.getElementById('msg');
 if(v===expected){m.className='msg ok';m.textContent='ACCESS GRANTED';setTimeout(()=>location.href="stage6.html",500)}
 else{m.className='msg bad';m.textContent='ACCESS DENIED';}
};
localStorage.setItem("lab_note","STORAGE-DELTA-2048");
sessionStorage.setItem("temporary_noise","ignore-me");

</script>
</body></html>
