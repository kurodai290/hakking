<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 8 — HIDDEN ROUTE</title><link rel="stylesheet" href="../style.css"></head>
<body>
<header><div class="logo">BLACKBOX<span>//LAB</span></div><div class="status">STAGE 08 / 10</div></header>
<main class="panel">
<div class="top"><div><div class="tag">STAGE 08</div><h1>HIDDEN ROUTE</h1></div><div class="hint">AUTHORIZED // LOCAL ONLY</div></div>
<div class="box"><p>リンク一覧に目的地がない。だが、サイト内にはまだページがある。</p><div class="links"><a href="../index.html">home</a><a href="stage7.html">previous</a></div><p class="hint">ヒント：ファイル名、robots.txt、ディレクトリ構造などを調査。</p></div>
<div class="box">
<h2>UNLOCK</h2>
<input id="answer" class="input" autocomplete="off" placeholder="解除コード">
<button class="submit" id="go">CHECK</button><div id="msg" class="msg"></div>
</div>
</main>
<script>
const expected="ROUTE-404-KEY";
document.getElementById('go').onclick=()=>{
 const v=document.getElementById('answer').value.trim();
 const m=document.getElementById('msg');
 if(v===expected){m.className='msg ok';m.textContent='ACCESS GRANTED';setTimeout(()=>location.href="stage9.html",500)}
 else{m.className='msg bad';m.textContent='ACCESS DENIED';}
};

</script>
</body></html>
