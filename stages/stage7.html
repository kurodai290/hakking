<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 7 — ENCODING</title><link rel="stylesheet" href="../style.css"></head>
<body>
<header><div class="logo">BLACKBOX<span>//LAB</span></div><div class="status">STAGE 07 / 10</div></header>
<main class="panel">
<div class="top"><div><div class="tag">STAGE 07</div><h1>ENCODING</h1></div><div class="hint">AUTHORIZED // LOCAL ONLY</div></div>
<div class="box"><p>見つけた文字列は、そのまま答えとは限らない。複数の変換を見破れ。</p><div class="terminal">c2VjdXJlX2NvZGU6IEVOQy1HQVRFLTQxNw==</div><p class="hint">ヒント：Base64の見た目をしている。</p></div>
<div class="box">
<h2>UNLOCK</h2>
<input id="answer" class="input" autocomplete="off" placeholder="解除コード">
<button class="submit" id="go">CHECK</button><div id="msg" class="msg"></div>
</div>
</main>
<script>
const expected="ENC-GATE-417";
document.getElementById('go').onclick=()=>{
 const v=document.getElementById('answer').value.trim();
 const m=document.getElementById('msg');
 if(v===expected){m.className='msg ok';m.textContent='ACCESS GRANTED';setTimeout(()=>location.href="stage8.html",500)}
 else{m.className='msg bad';m.textContent='ACCESS DENIED';}
};

</script>
</body></html>
